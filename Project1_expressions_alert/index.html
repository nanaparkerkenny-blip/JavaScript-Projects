<! DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>Expression Assignment</title>
        <body>

             <!-- link to external JavaScript file -->
            <script src="JS/main.js"></script>

            <script>
              var message ="Hello, this is my string!";
              var myText ='\'m a string with an apostrophe and "double quotes" inside it!';
              var text1 ="I'm happy!"; //double quotes outside -apostrophe is fine
              var text2 ='He said "Hello!"'; //single quotes outside - double quotes are fine
              alert(message); //window.alert() also works, alert() is shorter
              alert(myText);
              alert(text1);
              alert(text2);
            </script>

            <h1>Expression Assignment</h1>
            <!-- Script can also go here in the body, just above closing </body>-->
             <p>This is a simple HTML page with an external JavaScript file.</p>
        </body>
    </head>
</html>
