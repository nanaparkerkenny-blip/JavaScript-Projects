<! DOCTYPE html>
<html>
    <body>
        <h2 id="demoText"> Original Text Here</h2>
        <script>
            // Find the element by its id
            const element = document.getElementById("demoText");
            // Change its content
            element.textContent = " I changed this with getElementById()";
            element.style.color = "blue";
        </script>
    </body>
</html>
